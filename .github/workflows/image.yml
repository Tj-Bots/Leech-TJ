name: Base image

on:
  workflow_dispatch:
  push:
    branches: [wzgram]
    paths:
      - requirements.txt
      - Dockerfile.base
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ghcr.io/tj-bots/leech-tj:base
